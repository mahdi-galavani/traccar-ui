<div class="page-header">
  <h1 class="page-title">{{ 'user.page_title' | translate }}</h1>
</div>

<app-data-table
  [columns]="columns"
  [items]="items()"
  [loading]="loading()"
  [canViewListItems]="true"
  (add)="onAdd()"
  (edit)="onEdit($event)"
  (delete)="onDelete($event)"
  (viewListItems)="getAction($event)"
/>

@if (showForm()) {
  <app-dynamic-form
    [title]="formTitle"
    [fields]="fields"
    [model]="selected()"
    (saved)="onSave($event)"
    (cancelled)="onCancel()"
  />
}

@if (showActionForm()) {
  <app-dynamic-form
    [title]="'user.roles'"
    [fields]="roleFields"
    [model]="selectedRoleModel()"
    (saved)="onSaveRol($event)"
    (cancelled)="onCancelRole()"
  />
}
