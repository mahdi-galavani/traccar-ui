<!-- edit-load-modal.component.html -->
@if (open) {
  <div class="modal-backdrop" (click)="cancel()">
    <div class="modal-card" (click)="$event.stopPropagation()">
      <div class="modal-header">
        <h2 class="modal-title">{{ 'fleet_schedule.edit_load' | translate }}</h2>
        <button type="button" class="modal-close" (click)="cancel()">✕</button>
      </div>

      <form #loadForm="ngForm" (ngSubmit)="save(loadForm)">
        <div class="modal-body">
          <div class="form-group">
            <label>{{ 'fleet_schedule.first_class_seats' | translate }}</label>
            <input
              type="number"
              name="firstClassSeat"
              [(ngModel)]="dto.firstClassSeat"
              min="0"
              required
              class="form-control"
            />
          </div>
          <div class="form-group">
            <label>{{ 'fleet_schedule.business_class_seats' | translate }}</label>
            <input
              type="number"
              name="businessClassSeat"
              [(ngModel)]="dto.businessClassSeat"
              min="0"
              required
              class="form-control"
            />
          </div>
          <div class="form-group">
            <label>{{ 'fleet_schedule.economic_class_seats' | translate }}</label>
            <input
              type="number"
              name="economicClassSeat"
              [(ngModel)]="dto.economicClassSeat"
              min="0"
              required
              class="form-control"
            />
          </div>
          <div class="form-group">
            <label>{{ 'fleet_schedule.payload' | translate }}</label>
            <input
              type="number"
              name="payload"
              [(ngModel)]="dto.payload"
              min="0"
              required
              class="form-control"
            />
          </div>
        </div>

        <div class="modal-footer">
          <button type="button" class="btn-secondary" (click)="cancel()">
            {{ 'common.cancel' | translate }}
          </button>
          <button type="submit" class="btn-primary" [disabled]="!loadForm.valid">
            {{ 'common.save' | translate }}
          </button>
        </div>
      </form>
    </div>
  </div>
}
