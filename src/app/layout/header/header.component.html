<header class="app-header">
  <div class="header-left-side">
    <div class="brand-wrapper">
      <div class="brand-logo-mock">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg>
      </div>
      <div class="brand-text">
        <span class="main-title">{{ 'app.title' | translate }}</span>
        <span class="sub-title">Fleet Control Center</span>
      </div>
    </div>
  </div>

  <div class="header-actions">
    <div class="action-item lang-zone">
      <app-language-selector />
    </div>

    @if (currentUser(); as user) {
      <div class="profile-card">
        <div class="user-info">
          <span class="username">{{ user.username }}</span>
          <span class="user-role">System Administrator</span>
        </div>

        <div class="avatar-gradient">
          {{ user.username?.charAt(0)?.toUpperCase() || 'U' }}
        </div>

        <button type="button" class="logout-action-btn" (click)="logout()" [title]="'auth.logout' | translate">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
            <polyline points="16 17 21 12 16 7"></polyline>
            <line x1="21" y1="12" x2="9" y2="12"></line>
          </svg>
        </button>
      </div>
    }
  </div>
</header>
